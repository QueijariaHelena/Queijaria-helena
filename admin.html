<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Painel Queijaria Helena</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #fff8e7;
  padding: 20px;
}

h1 {
  text-align: center;
  color: #7a4b20;
}

.caixa {
  background: white;
  padding: 20px;
  margin: 15px 0;
  border-radius: 12px;
}

input, button {
  padding: 10px;
  margin: 5px;
  border-radius: 8px;
}

button {
  background: #7a4b20;
  color: white;
  border: none;
}

.titulo {
  color: #7a4b20;
}
</style>

</head>

<body>

<h1>🌿 Queijaria Helena</h1>
<h2 style="text-align:center;">Painel de Controle</h2>

<div class="caixa">
<h2 class="titulo">🧀 Produtos</h2>

<input placeholder="Nome do produto">
<input placeholder="Quantidade">
<input placeholder="Preço">

<button>Cadastrar Produto</button>

</div>


<div class="caixa">

<h2 class="titulo">💰 Lançar Venda</h2>

<input placeholder="Produto vendido">
<input placeholder="Valor da venda">

<button>Registrar Venda</button>

</div>


<div class="caixa">

<h2 class="titulo">📊 Financeiro</h2>

<p>Total vendido: R$ 0,00</p>

<p>Custos: R$ 0,00</p>

<p>Lucro: R$ 0,00</p>

</div>


</body>
</html>
